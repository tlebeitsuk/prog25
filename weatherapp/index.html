<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Weather</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="screen">
        <header>
            <span>Jakobstad</span>
            <time>09:14</time>
        </header>

        <main>
            <h1 class="temperature">
                <span id="temperature"></span>
                <span id="symbol">°</span>
            </h1>
        </main>

        <footer>
            <span>Partly cloudy</span>
            <span>H: 20° &nbsp; L: 12°</span>
        </footer>
    </div>

    <script src="app.js"></script>
</body>

</html>
